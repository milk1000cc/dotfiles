# Thanks to:
# ターミナルマルチプレクサ tmux 入門 (https://www.amazon.co.jp/dp/B00AVA3A38)
# https://thoughtbot.com/blog/tmux-copy-paste-on-os-x-a-better-future

# prefix: C-t
set-option -g prefix C-t
unbind-key C-b

# C-t C-t で last-window
bind-key C-t last-window

# C-t r で tmux 設定リロード
bind-key r source-file ~/.config/tmux/tmux.conf \; display 'Reloaded'

# コピーモードのキーバインディング
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# ステータスライン
set-option -g status-right ''
set-option -g status-style fg=black,bg=white
set-window-option -g window-status-current-style fg=red,bright,bg=black

set -g focus-events on

# Claude Code の実行ファイル名はバージョン番号 (例: 2.1.283) なので、ウィンドウ名は claude と表示する
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}}#{?pane_dead,[dead],}'
