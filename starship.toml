"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$ruby\
$git_branch\
$git_status\
$line_break\
$character"""

add_newline = false

[directory]
truncation_length = 0
truncate_to_repo = false
style = 'bold yellow'

[ruby]
format = '[$version]($style) '
version_format = '${raw}'
style = 'bold underline purple'

[git_branch]
format = '[\[$branch]($style)'
style = 'bold green'

[git_status]
format = '[$stashed( $ahead_behind)\]]($style)'
style = 'bold green'
up_to_date = '✓'
stashed = ':$count'

[character]
success_symbol = '[❯](bold blue)'
error_symbol = '[❯](bold blue)'
